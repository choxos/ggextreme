url: https://choxos.github.io/ggextreme/

template:
  bootstrap: 5
  bslib:
    primary: "#22928F"
    base_font: {google: "Lato"}
    heading_font: {google: "Lato"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Presentation charts for ggplot2
  description: >
    Presentation quality charts built on ggplot2: animated bar chart races
    that stay readable while the field reorders, and interactive causal
    diagrams that carry the rationale and references for every node and
    arrow.

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]

reference:
- title: Building a race
  desc: Turn a panel of observations into frames, then draw or encode them.
  contents:
  - ggrace
  - race_frame
  - race_size
  - animate_race

- title: Appearance
  desc: Colors, theme and the images that sit on the bars.
  contents:
  - race_palette
  - theme_race
  - race_flags
  - race_flag_codes

- title: Causal diagrams
  desc: Draw a DAG whose nodes and arrows explain themselves, then use it as a widget, a ggplot or a file.
  contents:
  - ggcausal
  - graph_widget

- title: Data
  contents:
  - clefts_qci
  - cleft_dag

- title: Package
  contents:
  - ggextreme-package

articles:
- title: Articles
  navbar: ~
  contents:
  - ggextreme
  - how-the-animation-works
  - causal-diagrams
