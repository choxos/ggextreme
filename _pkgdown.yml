url: https://choxos.github.io/ggextreme/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#22928F"
    base_font: {google: "Lato"}
    heading_font: {google: "Lato"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Presentation charts for ggplot2
  description: >
    Presentation quality charts built on ggplot2: animated bar chart races
    that stay readable while the field reorders, interactive causal
    diagrams that carry the rationale and references for every node and
    arrow, and network meta-analysis plots that show the data behind every
    treatment and comparison.

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]

reference:
- title: Building a race
  desc: Turn a panel of observations into frames, then draw or encode them.
  contents:
  - ggrace
  - race_frame
  - race_size
  - animate_race

- title: Appearance
  desc: Colors, theme and the images that sit on the bars.
  contents:
  - race_palette
  - theme_race
  - race_flags
  - race_flag_codes

- title: Causal diagrams
  desc: Draw a DAG whose nodes and arrows explain themselves.
  contents:
  - ggcausal

- title: Network plots
  desc: Draw the network of a network meta-analysis from arm level data.
  contents:
  - ggnma

- title: Meta-analysis
  desc: Forest plots and league tables for fitted models.
  contents:
  - ggmeta
  - animate_meta
  - ggfunnel
  - ggleague

- title: Survival and trials
  desc: Kaplan-Meier plots with a linked risk table and proportional hazards tests, and swimmer plots of each patient's course.
  contents:
  - ggkm
  - animate_km
  - ggswimmer

- title: Maps
  desc: Choropleth maps that step or play through the years, with measures side by side.
  contents:
  - ggchoropleth
  - animate_choropleth

- title: Using a graph
  desc: Turn any of the interactive graphs into a widget, a ggplot or a file.
  contents:
  - graph_widget

- title: Data
  contents:
  - clefts_qci
  - clefts_qci_world
  - cleft_dag
  - psoriasis_nma

- title: Package
  contents:
  - ggextreme-package

articles:
- title: Articles
  navbar: ~
  contents:
  - ggextreme
  - how-the-animation-works
  - causal-diagrams
  - network-plots
  - forest-plots
  - funnel-plots
  - league-tables
  - kaplan-meier
  - swimmer-plots
  - choropleth-maps
